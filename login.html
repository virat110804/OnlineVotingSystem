<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voter Login</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-animated"></div>
    <div class="container center-content">
        <div class="card">
            <div class="card-header">
                <h2>Voter Login</h2>
                <p>Enter your Voter ID and password to cast your vote.</p>
            </div>
            
            <div id="alert-container"></div>

            <form id="login-form">
                <div class="form-group">
                    <label for="voter-id">Voter ID</label>
                    <input type="text" id="voter-id" class="form-control" placeholder="VOTER_XXXXXX" required>
                </div>
                
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
                </div>
                
                <button type="submit" class="btn btn-primary">Login to Vote</button>
            </form>

            <div class="card-footer">
                <a href="index.html" class="text-link">Back to Home</a> | <a href="register.html" class="text-link">New Voter? Register</a>
            </div>
        </div>
    </div>
    
    <script src="js/store.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
